# Automatic daily database backup (SRS §11).
# Dumps the whole Neon database every night and keeps each dump for 30 days as a workflow artifact,
# stored by GitHub — separate from Neon. Requires the repository secret DATABASE_URL.
# Restore with: pg_restore --clean --no-owner -d "$DATABASE_URL" mds-backup-YYYY-MM-DD.dump
name: Daily database backup

on:
  schedule:
    - cron: '30 19 * * *' # 01:00 Sri Lanka time (UTC+5:30)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          file="mds-backup-$(TZ=Asia/Colombo date +%F).dump"
          pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" -f "$file"
          ls -lh "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Keep backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
